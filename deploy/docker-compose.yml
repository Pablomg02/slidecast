# slidecast behind Cloudflare Tunnel. Run from this folder:
#   docker compose up -d --build                      # slidecast only
#   docker compose --profile tunnel up -d --build     # with cloudflared
# The tunnel token goes in deploy/.env (never commit it): TUNNEL_TOKEN=...
# See docs/deploy-raspberry.md.
services:
  slidecast:
    build: ..
    image: slidecast:local
    restart: unless-stopped
    volumes:
      - ./data/decks:/data
      - ./data/state:/state
    # No published ports: only cloudflared reaches it, on the compose network.
    # For LAN access without the tunnel, uncomment:
    # ports:
    #   - "4321:4321"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # Taken from deploy/.env. Not interpolated with ${…:?} on purpose: that
    # would make `docker compose up` fail without .env even for slidecast alone.
    environment:
      - TUNNEL_TOKEN
    depends_on:
      - slidecast
