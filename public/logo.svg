<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>slidecast</title>
  <!-- The live screen at the back (showing a web page) and two screens that
       follow it; its bottom edge shows between them. -->
  <defs>
    <linearGradient id="sc-g" gradientUnits="userSpaceOnUse" x1="4" y1="24" x2="96" y2="75">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <mask id="sc-k" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="1" y="49" width="45" height="29" rx="6" fill="#000"/>
      <rect x="54" y="49" width="45" height="29" rx="6" fill="#000"/>
    </mask>
  </defs>
  <g fill="url(#sc-g)" fill-opacity=".16" stroke="url(#sc-g)" stroke-width="4">
    <rect x="19" y="24" width="62" height="36" rx="3.6" mask="url(#sc-k)"/>
    <rect x="4" y="52" width="39" height="23" rx="3"/>
    <rect x="57" y="52" width="39" height="23" rx="3"/>
  </g>
  <g fill="none" stroke="url(#sc-g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42.58 33.1 37.35 38.6 42.58 44.1"/>
    <path d="M57.42 33.1 62.65 38.6 57.42 44.1"/>
    <path d="M52.31 32.83 47.69 44.38"/>
  </g>
</svg>
