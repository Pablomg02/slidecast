name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through [SECURITY.md](https://github.com/Pablomg02/slidecast/security/policy), not here. English or Spanish are both fine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `./start.sh --network`
        2. Open /my-deck/present on a phone
        3. …
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How slidecast is running
      options:
        - On this computer only (127.0.0.1)
        - Local network (--network / --host 0.0.0.0)
        - Tailscale
        - Cloudflare Tunnel
        - Raspberry Pi (install script)
        - Docker Compose
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slidecast version or commit
      description: "`node bin/slidecast.js --version`, or `git rev-parse --short HEAD`."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and operating system
      placeholder: "Node 22.11, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device of the affected page
      placeholder: "Presenter on Safari, iPhone; viewer on Chrome, Windows"
  - type: textarea
    id: deck
    attributes:
      label: Deck
      description: Does it happen with the demo deck (`examples/demo`)? If only with your deck, attach a minimal one that shows it, or describe how it navigates (native API, generic slides…).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal output of slidecast and the browser console, if relevant. Remove passwords and hostnames.
      render: text
