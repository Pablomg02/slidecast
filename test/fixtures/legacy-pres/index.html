<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Legacy PRES fixture</title>
<!-- Synthetic test deck reproducing the public surface of the legacy "PRES"
     engine described in plans/…/research/legacy-deck-engine.md. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; background: #fff; }
  .scene { position: absolute; inset: 0; padding: 100px; display: none; font-size: 48px; }
  .scene.active { display: block; }
  [data-in] { visibility: hidden; }
  [data-in].vis { visibility: visible; }
  [data-out].gone { visibility: hidden; }
  .go { color: #c00; }
  .on { background: #ff0; }
  #nav { position: fixed; right: 10px; bottom: 10px; z-index: 5; }
  #blank { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
  #blank.show, .overlay.show { display: block; }
  .overlay { position: fixed; inset: 40px; background: #eee; display: none; z-index: 8; font-size: 24px; }
  body.static * { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="portada" data-section="start" data-ref="0">
    <h1>Fixture title</h1>
  </section>
  <section class="scene" id="intro" data-section="start" data-ref="1">
    <p>Intro line zero</p>
    <p data-in="1" id="intro-1">Intro line one</p>
    <p data-in="2" id="intro-2">Intro line two</p>
  </section>
  <section class="scene" id="lista" data-section="middle" data-ref="2">
    <ul>
      <li data-hl="1-2">Item A</li>
      <li data-hl="3">Item B</li>
      <li data-out="2">Item C (leaves at step 2)</li>
    </ul>
  </section>
  <section class="scene" id="tabla" data-section="middle" data-ref="3">
    <p data-in="1">Row one</p>
    <p data-in="2" data-go="3">Row two</p>
    <p data-in="3">Row three</p>
  </section>
  <section class="scene" id="fin" data-section="end" data-ref="4">
    <p>The end</p>
    <button id="local-btn" onclick="this.textContent='clicked'">Interactive</button>
  </section>
</div>
<div id="nav"><button id="prev">‹</button> <button id="next">›</button></div>
<div id="blank"></div>
<div class="overlay" id="index">Index overlay</div>
<div class="overlay" id="help">Help overlay</div>
<script>
const ORDEN = ['portada', 'intro', 'lista', ['tabla', [0, 2]], 'fin'];
const params = new URLSearchParams(location.search);
if (params.has('static')) document.body.classList.add('static');

function stepsOf(scene) {
  let max = 0;
  scene.querySelectorAll('[data-in],[data-out],[data-go]').forEach((el) => {
    for (const a of ['in', 'out', 'go']) if (el.dataset[a]) max = Math.max(max, +el.dataset[a]);
  });
  scene.querySelectorAll('[data-hl]').forEach((el) => {
    for (const part of el.dataset.hl.split(',')) max = Math.max(max, ...part.split('-').map(Number));
  });
  return max + 1;
}
function inRange(spec, k) {
  return spec.split(',').some((p) => {
    const [a, b] = p.split('-').map(Number);
    return b === undefined ? k === a : k >= a && k <= b;
  });
}
const SEQ = [];
for (const item of ORDEN) {
  const [id, only] = Array.isArray(item) ? item : [item, null];
  const n = stepsOf(document.getElementById(id));
  for (const k of only ?? [...Array(n).keys()]) SEQ.push({ id, k });
}
let cur = 0;

function show({ id, k }) {
  document.querySelectorAll('.scene').forEach((s) => s.classList.toggle('active', s.id === id));
  const scene = document.getElementById(id);
  scene.querySelectorAll('[data-in]').forEach((el) => el.classList.toggle('vis', k >= +el.dataset.in));
  scene.querySelectorAll('[data-out]').forEach((el) => el.classList.toggle('gone', k >= +el.dataset.out));
  scene.querySelectorAll('[data-go]').forEach((el) => el.classList.toggle('go', k >= +el.dataset.go));
  scene.querySelectorAll('[data-hl]').forEach((el) => el.classList.toggle('on', inRange(el.dataset.hl, k)));
}
function go(i, opts = {}) {
  cur = Math.max(0, Math.min(SEQ.length - 1, i));
  show(SEQ[cur]);
  history.replaceState(null, '', '#' + (cur + 1));
}
const next = () => go(cur + 1);
const prev = () => go(cur - 1);
function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  return Number.isFinite(n) ? n - 1 : 0;
}

window.PRES = {
  go: (i) => go(i, { jump: true }),
  pasos: SEQ.map((s) => s.id + ':' + s.k),
  js: [],
  actual: () => cur,
};

function toggle(id, force) { document.getElementById(id).classList.toggle('show', force); }
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', 'PageDown', 'Enter'].includes(k) || (k === ' ' && !e.shiftKey)) next();
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k) || (k === ' ' && e.shiftKey)) prev();
  else if (k === 'Home') go(0);
  else if (k === 'End') go(SEQ.length - 1);
  else if (k === 'f') document.documentElement.requestFullscreen?.();
  else if (k === 'b' || k === 'B' || k === '.') toggle('blank');
  else if (k === 'i' || k === 'o') toggle('index');
  else if (k === '?' || k === 'h') toggle('help');
  else if (k === 'Escape') { toggle('index', false); toggle('help', false); }
});
document.getElementById('stage').addEventListener('click', (e) => {
  if (e.target.closest('#nav, .overlay, button')) return;
  next();
});
document.getElementById('prev').addEventListener('click', prev);
document.getElementById('next').addEventListener('click', next);
let tx = null;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; });
stage.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) (dx < 0 ? next : prev)();
});
window.addEventListener('hashchange', () => go(fromHash(), { jump: true }));

function fit() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.transform = `translate(${(innerWidth - 1600 * s) / 2}px,${(innerHeight - 900 * s) / 2}px) scale(${s})`;
}
window.addEventListener('resize', fit);
fit();
document.addEventListener('DOMContentLoaded', () => go(fromHash()));
</script>
</body>
</html>
