<!doctype html>
<html>
<head><meta charset="utf-8"><title>frame harness</title>
<link rel="stylesheet" href="/_slidecast/style.css">
<style>html,body{margin:0}#box{position:relative;width:390px;height:844px;background:#222}</style>
</head>
<body>
<div id="box"></div>
<script type="module">
  // Mounts the shell's createDeckFrame on #box (0010); the test sets the box
  // size and reads the frame through window.frame. ?deck= is the deck URL.
  import { createDeckFrame } from '/_slidecast/shell.js';
  const box = document.getElementById('box');
  window.mount = (opts) => {
    window.frame?.destroy();
    window.frame = createDeckFrame(box, new URLSearchParams(location.search).get('deck'), opts);
    return window.frame.ready.then(() => true);
  };
  window.__ready = true;
</script>
</body>
</html>
